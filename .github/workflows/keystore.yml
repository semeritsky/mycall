name: Создать ключ подписи

# Запускается один раз, вручную. Создаёт ключ, которым будут подписаны все
# сборки APK, и отдаёт его в артефакте.
#
# Зачем отдельный workflow: keytool живёт в Java, а ставить Java только ради
# одной команды незачем — пусть эту команду выполнит GitHub.
#
# Что делать с результатом:
#   1. Скачать артефакт keystore, внутри два файла.
#   2. Содержимое debug.keystore.base64 положить в Settings → Secrets and
#      variables → Actions → New repository secret с именем DEBUG_KEYSTORE_BASE64.
#   3. Файл debug.keystore сохранить у себя навсегда. Без него не выпустить
#      обновление, которое встанет поверх установленного приложения.
#   4. Артефакт удалить со страницы запуска — он лежит в открытом виде.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сгенерировать ключ
        run: bash tools/make-keystore.sh debug.keystore

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            debug.keystore
            debug.keystore.base64
          retention-days: 1
          if-no-files-found: error

      - name: Напоминание
        run: |
          echo "::warning::Скачайте артефакт, положите base64 в секрет"
          echo "::warning::DEBUG_KEYSTORE_BASE64, затем удалите артефакт."
