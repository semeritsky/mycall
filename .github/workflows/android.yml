name: Собрать APK

# Запуск вручную кнопкой Run workflow, а также при любом изменении кода.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Без этого шага каждая сборка подписывается новым случайным ключом
      # и обновление не встанет поверх уже установленного приложения.
      - name: Постоянный ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Использую свой ключ подписи."
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_BASE64 не задан — APK подписан"
            echo "::warning::случайным ключом, обновления поверх не установятся."
          fi

      - name: Достроить проект
        run: bash tools/prepare.sh

      - name: Сборка release
        working-directory: app
        run: flutter build apk --release

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: mycall-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
