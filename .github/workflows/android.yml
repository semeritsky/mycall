name: Собрать APK

# Запуск вручную кнопкой Run workflow, а также при любом изменении кода.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Без этого шага каждая сборка подписывается новым случайным ключом
      # и обновление не встанет поверх уже установленного приложения.
      - name: Постоянный ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Использую свой ключ подписи."
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_BASE64 не задан — APK подписан"
            echo "::warning::случайным ключом, обновления поверх не установятся."
          fi

      - name: Достроить проект
        run: bash tools/prepare.sh

      - name: Сборка release
        working-directory: app
        # --build-number делает versionCode равным номеру запуска, то есть
        # каждая следующая сборка получает больший номер. Без этого все APK
        # имеют versionCode 1, и Android не считает новый файл обновлением.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Отпечаток подписи
        # Диагностика обновлений. Если этот отпечаток меняется от сборки к
        # сборке, значит секрет DEBUG_KEYSTORE_BASE64 не применяется и APK
        # подписан случайным ключом — обновление поверх установить нельзя.
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then
            echo "::notice::$("$SIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1)"
            "$SIGNER" verify --print-certs "$APK" | grep -i 'digest'
          else
            echo "apksigner не найден, пропускаю"
          fi

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: mycall-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
